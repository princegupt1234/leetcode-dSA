name: Update README

on:
  push:
    branches: [main]

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Compile and run
        run: |
          mkdir -p "$RUNNER_TEMP/readme-generator"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/readme-generator" tools/ReadmeGenerator.java
          java -cp "$RUNNER_TEMP/readme-generator" ReadmeGenerator

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "docs: update LeetCode solutions README"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes to commit"
          fi
